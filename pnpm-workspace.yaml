packages:
  - packages/*

# Supply-chain settings (pnpm 12). Policy summary: CLAUDE.md, Dependencies.
# Dependency lifecycle scripts never run. Nothing is listed in allowBuilds,
# and strictDepBuilds makes the install FAIL if any dependency has a build
# script (ERR_PNPM_IGNORED_BUILDS). `ignoreScripts: true` is deliberately NOT
# set: it makes pnpm skip that check and silently install such a package
# (red team RT-S9, verified with esbuild@0.25.0 on pnpm 12.17.0).
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
# Only resolve versions published at least 14 days ago (minutes).
minimumReleaseAge: 20160
minimumReleaseAgeStrict: true
# Transitive deps must come from the registry (no git/tarball sub-deps).
blockExoticSubdeps: true
# Fail if a package's publish trust level drops (e.g. provenance lost).
trustPolicy: no-downgrade
engineStrict: true
pmOnFail: error
saveExact: true
