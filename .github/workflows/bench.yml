name: bench

# Detection quality and timing on the benchmark corpus (bench/). Detection must not regress
# past bench/baseline.json (missed attacks and false positives per category); timing is
# reported in the job summary but not gated, since runners vary.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: bench (detection gate + timing report)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Same SHA pins as ci.yml, checked 2026-11-18.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run bench --quick --check
