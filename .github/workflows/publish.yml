name: publish

# Stages @glassbox/engine on npm with provenance, through npm trusted publishing (OIDC, no
# token). Nothing becomes public here: a staged version is only released when a maintainer
# approves it with 2FA (`npm stage approve <id>` or npmjs.com > Staged Packages).
#
# Three gates: it only runs when started by hand, only from main, and only after a reviewer
# approves the "npm-publish" environment.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stage (must equal packages/engine/package.json)"
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  stage:
    name: stage @glassbox/engine ${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing and the provenance attestation
    steps:
      # Same pinned actions as ci.yml (full commit SHA, tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache in the release job: a poisoned cache can't reach the package.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run bench --quick --check
      - name: Check the version and the npm CLI
        env:
          WANT: ${{ inputs.version }}
        run: |
          node -e '
            const have = JSON.parse(require("fs").readFileSync("packages/engine/package.json", "utf8")).version;
            if (have !== process.env.WANT) { console.error(`package.json has ${have}, asked for ${process.env.WANT}`); process.exit(1); }
            const [a, b] = require("child_process").execSync("npm --version").toString().trim().split(".").map(Number);
            if (a < 11 || (a === 11 && b < 15)) { console.error("npm 11.15.0 or later is needed for staged publishing"); process.exit(1); }
          '
      - name: Stage the package (approval with 2FA releases it)
        working-directory: packages/engine
        run: npm stage publish --access public
