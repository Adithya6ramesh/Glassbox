name: hook-release

# Builds the hook bundle that ships in the Claude Code plugin, tests it, and records its SHA-256.
# It publishes nothing: the owner creates the release and copies the notes from the job summary
# (or the release-notes.md artifact). Started by hand from the Actions tab.
on:
  workflow_dispatch:

# Least privilege: read the repo, upload an artifact. No release, no package publish.
permissions:
  contents: read

jobs:
  bundle:
    name: build and test the hook bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Same SHA pins as ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Full check against the source first, then the hook suite against the built bundle.
      - run: pnpm run check
      - run: pnpm --filter @glassbox-ai/hook run bundle
      - run: pnpm exec vitest run --project "hook (bundle)"
        env:
          GLASSBOX_HOOK_TARGET: bundle
      - name: SHA-256 and release notes
        shell: bash
        run: |
          set -euo pipefail
          cd packages/hook/dist/bundle
          sha256sum main.mjs > SHA256SUMS
          sum=$(cut -d' ' -f1 SHA256SUMS)
          {
            echo "## Hook bundle"
            echo ""
            echo "- File: \`main.mjs\` ($(wc -c < main.mjs) bytes)"
            echo "- SHA-256: \`${sum}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Built by: workflow run ${GITHUB_RUN_ID} (rolldown, Node $(node --version))"
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hook-bundle
          path: |
            packages/hook/dist/bundle/main.mjs
            packages/hook/dist/bundle/SHA256SUMS
            packages/hook/dist/bundle/release-notes.md
          if-no-files-found: error
